name: holly_quran
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.8.4+20

environment:
  sdk: '>=2.18.1 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  font_awesome_flutter: ^10.3.0
  go_router: ^15.0.0
  #equatable: ^2.0.5
  #dartz: ^0.10.1
  dio: ^5.8.0+1
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  animated_bottom_navigation_bar: ^1.1.0+1
  change_app_package_name: ^1.1.0
  shared_preferences: ^2.0.17
  #internet_connection_checker: ^1.0.0+1
  lottie: ^3.3.1
  #webview_flutter: ^4.0.2
  quran: ^1.2.0
  awesome_dialog: ^3.2.0
  flutter_native_splash: ^2.2.16
  adhan: ^2.0.0-nullsafety.2
  intl: ^0.20.2
  location: ^8.0.0
  hijri: ^3.0.0
  flutter_fortune_wheel: ^1.2.0
  signature: ^6.0.0
  carousel_slider: ^5.0.0
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  share_plus: ^10.1.4
  url_launcher: ^6.1.10
  vibration: ^3.1.3
  path_provider: ^2.1.2
  percent_indicator: ^4.2.3
  sqflite: ^2.2.8
  audioplayers: ^6.4.0
  audio_video_progress_bar: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# flutter_native_splash
flutter_native_splash:
  color: "#673AB7"
  image: assets/images/icon.jpg
  fullscreen: true
  android: true
  ios: true
  web: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill

#flutter_icons
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/icon.jpg"
  ios: true

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/json/
    - assets/quran_data/
    - assets/media/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Light.ttf
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
        - asset: assets/fonts/Cairo/Cairo-Black.ttf
        - asset: assets/fonts/Cairo/Cairo-ExtraLight.ttf
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf